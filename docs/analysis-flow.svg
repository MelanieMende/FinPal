<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1820" viewBox="0 0 1200 1820" role="img" aria-labelledby="title description">
  <title id="title">FinPal Analyseablauf</title>
  <desc id="description">Flussdiagramm vom Laden der Finanzdaten über Recherche, Risikoprüfung und Portfoliomodell bis zur validierten Empfehlung. Belegte Risiken sind Entscheidungsfaktoren und keine automatischen Blocker.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .section { font: 700 16px system-ui, sans-serif; letter-spacing: 1.2px; fill: #475569; }
      .node-title { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .node-text { font: 400 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 14px system-ui, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 700 14px system-ui, sans-serif; fill: #475569; }
      .process { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .research { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .risk { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .positive { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .warning { fill: #fffbeb; stroke: #fbbf24; stroke-width: 2; }
      .blocker { fill: #fff1f2; stroke: #fb7185; stroke-width: 2; }
      .decision { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1200" height="1820" rx="24" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" class="title">FinPal Analyseablauf</text>
  <text x="600" y="86" text-anchor="middle" class="subtitle">Von aktuellen Finanzdaten zur fachlich begründeten und validierten Handlungsempfehlung</text>

  <text x="60" y="138" class="section">1 · DATENGRUNDLAGE</text>
  <rect x="390" y="112" width="420" height="78" rx="14" class="process"/>
  <text x="600" y="143" text-anchor="middle" class="node-title">Analyse starten</text>
  <text x="600" y="168" text-anchor="middle" class="node-text">Portfolio, Cash und Anlageprofil laden</text>

  <path d="M600 190 V224" class="edge"/>
  <rect x="390" y="226" width="420" height="86" rx="14" class="process"/>
  <text x="600" y="258" text-anchor="middle" class="node-title">Kurse und Wechselkurse aktualisieren</text>
  <text x="600" y="283" text-anchor="middle" class="node-text">Gehaltene Assets nacheinander · gemeinsamer FX-Snapshot</text>

  <path d="M600 312 V354" class="edge"/>
  <text x="60" y="368" class="section">2 · RECHERCHE UND PRIMÄRBERICHTE</text>
  <polygon points="600,342 770,414 600,486 430,414" class="decision"/>
  <text x="600" y="405" text-anchor="middle" class="node-title">Suchdaten aktuell?</text>
  <text x="600" y="430" text-anchor="middle" class="node-text">24-Stunden-Cache prüfen</text>

  <path d="M430 414 H260 V520" class="edge"/>
  <text x="310" y="401" class="edge-label">Nein</text>
  <rect x="80" y="522" width="360" height="82" rx="14" class="research"/>
  <text x="260" y="554" text-anchor="middle" class="node-title">Online-Recherche</text>
  <text x="260" y="579" text-anchor="middle" class="node-text">Deterministische Suche ohne KI</text>

  <path d="M770 414 H940 V520" class="edge"/>
  <text x="855" y="401" class="edge-label">Ja</text>
  <rect x="760" y="522" width="360" height="82" rx="14" class="research"/>
  <text x="940" y="554" text-anchor="middle" class="node-title">Suchdaten wiederverwenden</text>
  <text x="940" y="579" text-anchor="middle" class="node-text">Gespeicherter Recherchestand</text>

  <path d="M260 604 V642 H600" class="edge"/>
  <path d="M940 604 V642 H600" class="edge"/>
  <rect x="390" y="644" width="420" height="86" rx="14" class="research"/>
  <text x="600" y="676" text-anchor="middle" class="node-title">Primärberichte abgleichen</text>
  <text x="600" y="701" text-anchor="middle" class="node-text">Dokumentcache und neuesten Berichtsstand prüfen</text>

  <path d="M600 730 V778" class="edge"/>
  <text x="60" y="792" class="section">3 · RISIKOPRÜFUNG</text>
  <rect x="390" y="780" width="420" height="86" rx="14" class="risk"/>
  <text x="600" y="812" text-anchor="middle" class="node-title">Risikobefund laden oder neu prüfen</text>
  <text x="600" y="837" text-anchor="middle" class="node-text">Unverändert: Cache · neue Dokumente oder Regeln: fachliche Prüfung</text>

  <path d="M600 866 V900" class="edge"/>
  <polygon points="600,888 790,962 600,1036 410,962" class="decision"/>
  <text x="600" y="949" text-anchor="middle" class="node-title">Prüfergebnis</text>
  <text x="600" y="974" text-anchor="middle" class="node-text">Was wurde tatsächlich belegt?</text>

  <path d="M410 962 H230 V1080" class="edge"/>
  <text x="255" y="949" class="edge-label">Risiko</text>
  <rect x="60" y="1082" width="340" height="118" rx="14" class="risk"/>
  <text x="230" y="1113" text-anchor="middle" class="node-title">Entscheidungsfaktor</text>
  <text x="230" y="1140" text-anchor="middle" class="node-text">Richtung und Positionsgröße</text>
  <text x="230" y="1165" text-anchor="middle" class="node-text">fachlich beeinflussen</text>
  <text x="230" y="1190" text-anchor="middle" class="small">Kein automatischer Blocker</text>

  <path d="M600 1036 V1080" class="edge"/>
  <rect x="430" y="1082" width="340" height="118" rx="14" class="warning"/>
  <text x="600" y="1113" text-anchor="middle" class="node-title">Restunsicherheit</text>
  <text x="600" y="1140" text-anchor="middle" class="node-text">Geprüfte offene Punkte</text>
  <text x="600" y="1165" text-anchor="middle" class="node-text">sichtbar dokumentieren</text>
  <text x="600" y="1190" text-anchor="middle" class="small">Kein automatischer Blocker</text>

  <path d="M790 962 H970 V1080" class="edge"/>
  <text x="861" y="949" class="edge-label">Datenlücke</text>
  <rect x="800" y="1082" width="340" height="118" rx="14" class="blocker"/>
  <text x="970" y="1113" text-anchor="middle" class="node-title">Konkreter Datenblocker</text>
  <text x="970" y="1140" text-anchor="middle" class="node-text">Nur wenn die fehlende Information</text>
  <text x="970" y="1165" text-anchor="middle" class="node-text">die Entscheidung wirklich verhindert</text>
  <text x="970" y="1190" text-anchor="middle" class="small">Grund ausdrücklich benennen</text>

  <path d="M230 1200 V1242 H600" class="edge"/>
  <path d="M600 1200 V1244" class="edge"/>
  <path d="M970 1200 V1242 H600" class="edge"/>

  <text x="60" y="1264" class="section">4 · MODELL UND ENTSCHEIDUNG</text>
  <rect x="390" y="1246" width="420" height="94" rx="14" class="process"/>
  <text x="600" y="1278" text-anchor="middle" class="node-title">Forecasts parallel laden und Modell berechnen</text>
  <text x="600" y="1303" text-anchor="middle" class="node-text">Forecasts und Risikohistorien je Asset parallel · danach Allokation,</text>
  <text x="600" y="1326" text-anchor="middle" class="node-text">Gebühren, Cashreserve, Finanzierung und Stressszenarien prüfen</text>

  <path d="M600 1340 V1382" class="edge"/>
  <polygon points="600,1370 790,1442 600,1514 410,1442" class="decision"/>
  <text x="600" y="1429" text-anchor="middle" class="node-title">Konkreter Hinderungsgrund?</text>
  <text x="600" y="1454" text-anchor="middle" class="node-text">Daten, Strategie, Finanzierung oder Ausführung</text>

  <path d="M410 1442 H230 V1550" class="edge"/>
  <text x="284" y="1429" class="edge-label">Nein</text>
  <rect x="60" y="1552" width="340" height="104" rx="14" class="positive"/>
  <text x="230" y="1584" text-anchor="middle" class="node-title">Handlungsrichtung</text>
  <text x="230" y="1611" text-anchor="middle" class="node-text">Kaufen · Halten · Verkaufen</text>
  <text x="230" y="1637" text-anchor="middle" class="small">Risiken fließen in die Begründung ein</text>

  <path d="M790 1442 H970 V1550" class="edge"/>
  <text x="866" y="1429" class="edge-label">Ja</text>
  <rect x="800" y="1552" width="340" height="104" rx="14" class="blocker"/>
  <text x="970" y="1584" text-anchor="middle" class="node-title">Gezielt blockieren</text>
  <text x="970" y="1611" text-anchor="middle" class="node-text">Nur betroffenes Asset einfrieren</text>
  <text x="970" y="1637" text-anchor="middle" class="small">Übriges Portfolio neu optimieren</text>

  <path d="M230 1656 V1690 H600" class="edge"/>
  <path d="M970 1656 V1690 H600" class="edge"/>

  <text x="60" y="1708" class="section">5 · VALIDIERUNG UND ERGEBNIS</text>
  <rect x="390" y="1692" width="420" height="92" rx="14" class="positive"/>
  <text x="600" y="1724" text-anchor="middle" class="node-title">KI-Empfehlung validieren</text>
  <text x="600" y="1749" text-anchor="middle" class="node-text">Quellen, Beträge, Finanzierung und Blocker prüfen</text>
  <text x="600" y="1774" text-anchor="middle" class="node-text">Bei Fehlern korrigieren · anschließend speichern</text>
</svg>
