<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2280" viewBox="0 0 1200 2280" role="img" aria-labelledby="title description">
  <title id="title">FinPal Analyseablauf</title>
  <desc id="description">Flussdiagramm vom Laden der Finanzdaten über Recherche, Risikoprüfung mit aktuell bestätigten Verwahr-, Produkt- und Steuerangaben und Portfoliomodell bis zur validierten Empfehlung. Bei einer einzelnen erneuten Risikoprüfung werden Primärberichtsauszüge wiederverwendet, solange der Prüfstatus aktuell ist; nur „Berichte neu laden“ ruft sie ausdrücklich erneut ab. Der optionale Trade-Republic-Dokumentensync behält nur erkannte Krypto-Vertrags-PDFs dauerhaft; andere Timeline-PDFs werden nach der temporären Prüfung entfernt. Eine ausdrücklich nutzerbestätigte Angabe zu direkt gehaltenen Kryptowerten kann zusammen mit bestätigter Trade-Republic-Verwahrung die angegebene Halteform zuordnen, ersetzt aber keine Produktverifizierung oder passenden Vertragsunterlagen. Bei Bitcoin werden MiCAR-Diensterahmen, Steuerquellen, Anbieterstatus und exakt passende Produktvertragsunterlagen getrennt bewertet. Bestätigt der Nutzer, dass bei Trade Republic keine BTC-Produktunterlagen verfügbar sind, gilt dies höchstens drei Monate als geprüfte Restunsicherheit; danach ist eine erneute Bestätigung erforderlich. Eine Anbieterzulassung oder Steuerregel belegt keine Produktbilligung. Die Bitcoin-Mining-Pool-Verteilung wird als aktuelle 7-Tage-Blockstichprobe geprüft; sie belegt keine tatsächliche Hashing-Kontrolle. Belegte Risiken sind Entscheidungsfaktoren und keine automatischen Blocker. Das Ergebnis enthält für jedes aktuell gehaltene Asset eine eigene Karte; dessen dauerhafte Einzelangaben stehen direkt unter dem KI-Ergebnis.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .section { font: 700 16px system-ui, sans-serif; letter-spacing: 1.2px; fill: #475569; }
      .node-title { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .node-text { font: 400 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 14px system-ui, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 700 14px system-ui, sans-serif; fill: #475569; }
      .process { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .research { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .risk { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .positive { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .warning { fill: #fffbeb; stroke: #fbbf24; stroke-width: 2; }
      .blocker { fill: #fff1f2; stroke: #fb7185; stroke-width: 2; }
      .decision { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 7; }
      .ai-badge { fill: #7c3aed; }
      .ai-badge-text { font: 700 12px system-ui, sans-serif; fill: #ffffff; letter-spacing: .4px; }
    </style>
  </defs>

  <rect width="1200" height="2280" rx="24" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" class="title">FinPal Analyseablauf</text>
  <text x="600" y="86" text-anchor="middle" class="subtitle">Von aktuellen Finanzdaten zur fachlich begründeten und validierten Handlungsempfehlung</text>
  <rect x="900" y="112" width="240" height="24" rx="12" class="ai-badge"/>
  <text x="1020" y="129" text-anchor="middle" class="ai-badge-text">KI-UNTERSTÜTZTER SCHRITT</text>

  <text x="60" y="138" class="section">1 · DATENGRUNDLAGE</text>
  <rect x="390" y="112" width="420" height="78" rx="14" class="process"/>
  <text x="600" y="143" text-anchor="middle" class="node-title">Analyse starten</text>
  <text x="600" y="168" text-anchor="middle" class="node-text">Portfolio inkl. Immobilien, Cash und Anlageprofil laden</text>

  <path d="M600 190 V224" class="edge"/>
  <rect x="390" y="226" width="420" height="86" rx="14" class="process"/>
  <text x="600" y="258" text-anchor="middle" class="node-title">Kurse und Wechselkurse aktualisieren</text>
  <text x="600" y="283" text-anchor="middle" class="node-text">Gehaltene Assets nacheinander · gemeinsamer FX-Snapshot</text>

  <path d="M600 312 V354" class="edge"/>
  <text x="60" y="368" class="section">2 · RECHERCHE UND PRIMÄRBERICHTE</text>
  <polygon points="600,342 770,414 600,486 430,414" class="decision"/>
  <text x="600" y="405" text-anchor="middle" class="node-title">Suchdaten aktuell?</text>
  <text x="600" y="430" text-anchor="middle" class="node-text">Unverändert: Cache</text>
  <text x="600" y="452" text-anchor="middle" class="small">Geändert oder abgelaufen: neu laden</text>

  <path d="M770 414 H960 V520" class="edge"/>
  <text x="855" y="401" class="edge-label">Nein</text>
  <rect x="780" y="522" width="360" height="84" rx="14" class="research"/>
  <text x="960" y="556" text-anchor="middle" class="node-title">Online-Recherche</text>
  <text x="960" y="581" text-anchor="middle" class="node-text">Deterministische Suche</text>

  <path d="M600 486 V680" class="edge"/>
  <text x="620" y="530" class="edge-label">Ja</text>
  <path d="M960 606 V640 H300 V760 H410" class="edge"/>
  <polygon points="600,690 790,760 600,830 410,760" class="decision"/>
  <text x="600" y="751" text-anchor="middle" class="node-title">Primärberichte aktuell?</text>
  <text x="600" y="776" text-anchor="middle" class="node-text">Gültigkeit und Dokumentstand vergleichen</text>

  <path d="M600 830 V980" class="edge"/>
  <text x="620" y="870" class="edge-label">Ja</text>
  <path d="M790 760 H960 V860" class="edge"/>
  <text x="850" y="747" class="edge-label">Nein</text>
  <rect x="780" y="862" width="360" height="82" rx="14" class="research"/>
  <text x="960" y="896" text-anchor="middle" class="node-title">Primärberichte neu laden</text>
  <text x="960" y="921" text-anchor="middle" class="node-text">Wenn abgelaufen oder geändert</text>
  <path d="M960 944 V960 H700 V980" class="edge"/>

  <rect x="390" y="982" width="420" height="80" rx="14" class="research"/>
  <rect x="724" y="986" width="72" height="20" rx="10" class="ai-badge"/>
  <text x="760" y="1000" text-anchor="middle" class="ai-badge-text">KI</text>
  <text x="600" y="1028" text-anchor="middle" class="node-title">Primärbelege inhaltlich auswerten</text>
  <text x="600" y="1051" text-anchor="middle" class="node-text">Belegte Risiken und offene Punkte einordnen</text>

  <path d="M600 1062 V1118" class="edge"/>
  <text x="60" y="1124" class="section">3 · RISIKOPRÜFUNG</text>
  <rect x="390" y="1140" width="420" height="86" rx="14" class="risk"/>
  <rect x="724" y="1146" width="72" height="20" rx="10" class="ai-badge"/>
  <text x="760" y="1160" text-anchor="middle" class="ai-badge-text">KI</text>
  <text x="600" y="1180" text-anchor="middle" class="node-title">Risikobefund erstellen oder aktualisieren</text>
  <text x="600" y="1203" text-anchor="middle" class="node-text">SEC-Berichte, Kennzahlen und Anlegerangaben einbeziehen</text>
  <text x="600" y="1222" text-anchor="middle" class="small">Fehlende TR-BTC-Unterlagen: Nutzerbestätigung höchstens 3 Monate gültig</text>

  <path d="M600 1226 V1262" class="edge"/>
  <polygon points="600,1250 790,1320 600,1390 410,1320" class="decision"/>
  <text x="600" y="1311" text-anchor="middle" class="node-title">Prüfergebnis</text>
  <text x="600" y="1336" text-anchor="middle" class="node-text">Was wurde tatsächlich belegt?</text>

  <path d="M410 1320 H220 V1420" class="edge"/>
  <text x="280" y="1307" class="edge-label">Risiko</text>
  <rect x="50" y="1422" width="340" height="118" rx="14" class="risk"/>
  <text x="220" y="1453" text-anchor="middle" class="node-title">Entscheidungsfaktor</text>
  <text x="220" y="1480" text-anchor="middle" class="node-text">Richtung und Positionsgröße</text>
  <text x="220" y="1505" text-anchor="middle" class="node-text">fachlich beeinflussen</text>
  <text x="220" y="1530" text-anchor="middle" class="small">Kein automatischer Blocker</text>

  <path d="M600 1390 V1420" class="edge"/>
  <rect x="430" y="1422" width="340" height="118" rx="14" class="warning"/>
  <text x="600" y="1453" text-anchor="middle" class="node-title">Restunsicherheit</text>
  <text x="600" y="1480" text-anchor="middle" class="node-text">Poolanteile belegen keine Miner-Kontrolle</text>
  <text x="600" y="1505" text-anchor="middle" class="node-text">als geprüfte Restunsicherheit dokumentieren</text>
  <text x="600" y="1530" text-anchor="middle" class="small">Kein automatischer Blocker</text>

  <path d="M790 1320 H980 V1420" class="edge"/>
  <text x="875" y="1307" class="edge-label">Datenlücke</text>
  <rect x="810" y="1422" width="340" height="118" rx="14" class="blocker"/>
  <text x="980" y="1453" text-anchor="middle" class="node-title">Konkreter Datenblocker</text>
  <text x="980" y="1480" text-anchor="middle" class="node-text">Nur wenn die fehlende Information</text>
  <text x="980" y="1505" text-anchor="middle" class="node-text">die Entscheidung wirklich verhindert</text>
  <text x="980" y="1530" text-anchor="middle" class="small">Grund ausdrücklich benennen</text>

  <path d="M220 1540 V1580 H500 V1620" class="edge"/>
  <path d="M600 1540 V1620" class="edge"/>
  <path d="M980 1540 V1580 H700 V1620" class="edge"/>

  <text x="60" y="1604" class="section">4 · MODELL UND ENTSCHEIDUNG</text>
  <rect x="390" y="1622" width="420" height="94" rx="14" class="process"/>
  <rect x="724" y="1628" width="72" height="20" rx="10" class="ai-badge"/>
  <text x="760" y="1642" text-anchor="middle" class="ai-badge-text">KI</text>
  <text x="600" y="1668" text-anchor="middle" class="node-title">Forecasts laden und Modell berechnen</text>
  <text x="600" y="1691" text-anchor="middle" class="node-text">Forecasts und Risikohistorien je Asset parallel · danach Allokation,</text>
  <text x="600" y="1710" text-anchor="middle" class="node-text">Gebühren, Cashreserve, Finanzierung und Stressszenarien prüfen</text>

  <path d="M600 1716 V1740" class="edge"/>
  <polygon points="600,1748 790,1818 600,1888 410,1818" class="decision"/>
  <text x="600" y="1809" text-anchor="middle" class="node-title">Konkreter Hinderungsgrund?</text>
  <text x="600" y="1834" text-anchor="middle" class="node-text">Daten, Strategie, Finanzierung oder Ausführung</text>

  <path d="M410 1818 H220 V1950" class="edge"/>
  <text x="285" y="1805" class="edge-label">Nein</text>
  <rect x="50" y="1952" width="340" height="104" rx="14" class="positive"/>
  <text x="220" y="1984" text-anchor="middle" class="node-title">Handlungsrichtung</text>
  <text x="220" y="2011" text-anchor="middle" class="node-text">Kaufen · Halten · Verkaufen</text>
  <text x="220" y="2037" text-anchor="middle" class="small">Risiken fließen in die Begründung ein</text>

  <path d="M790 1818 H980 V1950" class="edge"/>
  <text x="870" y="1805" class="edge-label">Ja</text>
  <rect x="810" y="1952" width="340" height="104" rx="14" class="blocker"/>
  <text x="980" y="1984" text-anchor="middle" class="node-title">Gezielt blockieren</text>
  <text x="980" y="2011" text-anchor="middle" class="node-text">Nur betroffenes Asset einfrieren</text>
  <text x="980" y="2037" text-anchor="middle" class="small">Übriges Portfolio neu optimieren</text>

  <path d="M220 2056 V2100 H600" class="edge"/>
  <path d="M980 2056 V2100 H600" class="edge"/>
  <path d="M600 2100 V2140" class="edge"/>

  <text x="60" y="2130" class="section">5 · VALIDIERUNG UND ERGEBNIS</text>
  <rect x="390" y="2150" width="420" height="82" rx="14" class="positive"/>
  <rect x="724" y="2156" width="72" height="20" rx="10" class="ai-badge"/>
  <text x="760" y="2170" text-anchor="middle" class="ai-badge-text">KI</text>
  <text x="600" y="2192" text-anchor="middle" class="node-title">KI-Empfehlung validieren</text>
  <text x="600" y="2217" text-anchor="middle" class="node-text">Quellen, Beträge, Finanzierung, Blocker · Asset-Karten</text>
</svg>
